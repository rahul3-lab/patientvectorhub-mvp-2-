name: patientvectorhub

services:
  api-gateway:
    build: ./api-gateway
    ports: ["8000:8000"]
    environment:
      INGESTION_URL: http://ingestion:8001
      RAG_ENGINE_URL: http://rag-engine:8002
      AUTH_MODE: ${AUTH_MODE:-development}
    depends_on: [ingestion, rag-engine]
  ingestion:
    build: ./ingestion
    ports: ["8001:8001"]
    environment:
      VECTOR_STORE_URL: http://vector-store:8003
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
    depends_on: [vector-store]
  rag-engine:
    build: ./rag-engine
    ports: ["8002:8002"]
    environment:
      VECTOR_STORE_URL: http://vector-store:8003
      LLM_PROVIDER: ${LLM_PROVIDER:-grounded-template}
    depends_on: [vector-store]
  vector-store:
    build: ./vector-store
    ports: ["8003:8003"]
    environment:
      VECTOR_BACKEND: ${VECTOR_BACKEND:-memory}
  dashboard:
    build: ./dashboard
    ports: ["5173:5173"]
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    depends_on: [api-gateway]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-patientvectorhub}
      POSTGRES_USER: ${POSTGRES_USER:-pvh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]
  weaviate:
    image: semitechnologies/weaviate:1.27.7
    ports: ["8080:8080"]
    environment:
      QUERY_DEFAULTS_LIMIT: 25
      AUTHENTICATION_ANONYMOUS_ACCESS_ENABLED: "true"
      PERSISTENCE_DATA_PATH: /var/lib/weaviate
  kafka:
    image: bitnami/kafka:3.8
    ports: ["9092:9092"]
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
  vault:
    image: hashicorp/vault:1.17
    ports: ["8200:8200"]
    cap_add: [IPC_LOCK]
    environment: [VAULT_DEV_ROOT_TOKEN_ID=local-dev-token]
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev
    ports: ["8081:8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-local-only

volumes:
  postgres_data:
  qdrant_data:
