services:
  - type: web
    name: pvh-api-gateway
    runtime: docker
    dockerfilePath: ./patientvectorhub-mvp/api-gateway/Dockerfile
    dockerContext: ./patientvectorhub-mvp/api-gateway
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AUTH_MODE
        value: development
      - key: INGESTION_URL
        value: https://pvh-ingestion.onrender.com
      - key: RAG_ENGINE_URL
        value: https://pvh-rag-engine.onrender.com

  - type: web
    name: pvh-ingestion
    runtime: docker
    dockerfilePath: ./patientvectorhub-mvp/ingestion/Dockerfile
    dockerContext: ./patientvectorhub-mvp/ingestion
    plan: free
    healthCheckPath: /health
    envVars:
      - key: VECTOR_STORE_URL
        value: https://pvh-vector-store.onrender.com
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMBEDDING_MODEL
        value: text-embedding-3-small

  - type: web
    name: pvh-rag-engine
    runtime: docker
    dockerfilePath: ./patientvectorhub-mvp/rag-engine/Dockerfile
    dockerContext: ./patientvectorhub-mvp/rag-engine
    plan: free
    healthCheckPath: /health
    envVars:
      - key: VECTOR_STORE_URL
        value: https://pvh-vector-store.onrender.com
      - key: LLM_PROVIDER
        value: grounded-template

  - type: web
    name: pvh-vector-store
    runtime: docker
    dockerfilePath: ./patientvectorhub-mvp/vector-store/Dockerfile
    dockerContext: ./patientvectorhub-mvp/vector-store
    plan: free
    healthCheckPath: /health
    envVars:
      - key: VECTOR_BACKEND
        value: memory
